name: CupidDot Trigger

on:
  schedule:
    # Corre todos los días a las 11:00 AM hora Guadalajara (17:00 UTC)
    - cron: '0 17 * * *'
  workflow_dispatch: # Permite dispararlo a mano cuando quieras probarlo

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Run trigger
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python engine.py

      - name: Save State
        run: |
          git config --global user.name "CupidDot-Bot"
          git config --global user.email "bot@cupiddot.local"
          git add state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "update state [skip ci]" && git push)
